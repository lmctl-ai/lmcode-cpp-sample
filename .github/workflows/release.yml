name: Release and lmscript install
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable sample version (must match --version)
        required: true
        default: v0.1.0
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, label: linux-x64, ext: ''}
          - {os: ubuntu-24.04-arm, label: linux-arm64, ext: ''}
          - {os: macos-15, label: macos-arm64, ext: ''}
          - {os: macos-15-intel, label: macos-x64, ext: ''}
          - {os: windows-2022, label: windows-x64, ext: '.exe'}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Toolchain
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global @lmctl-ai/lmctl@0.2.420
          if [[ "$RUNNER_OS" == Windows ]]; then
            if ! command -v g++ >/dev/null || ! command -v make >/dev/null; then choco install -y mingw make; fi
            mkdir -p .ci-bin
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > .ci-bin/python3
            chmod +x .ci-bin/python3
            echo "$PWD/.ci-bin" >> "$GITHUB_PATH"
          fi
      - name: Build standalone artifact and run full corpus
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            export CXXFLAGS='-std=c++17 -O2 -Wall -Wextra -Werror -pedantic -static'
          elif [[ "$RUNNER_OS" == Linux ]]; then
            export CXXFLAGS='-std=c++17 -O2 -Wall -Wextra -Werror -pedantic -static-libstdc++ -static-libgcc'
          fi
          ./test.sh
          [[ "$(build/lmcode-cpp-sample --version)" == "lmcode-cpp-sample ${RELEASE_TAG#v}" ]]
          mkdir -p dist
          cp 'build/lmcode-cpp-sample${{ matrix.ext }}' 'dist/lmcode-cpp-sample-${{ matrix.label }}${{ matrix.ext }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.label }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Publish an immutable prerelease, never move latest
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum * > SHA256SUMS)
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release kept unchanged; installer tests will verify those bytes.'
          else
            gh release create "$RELEASE_TAG" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "$RELEASE_TAG" --notes 'Teaching host built and corpus-tested on five native targets. The following CI jobs verify pinned lmscript installation.'
          fi
  install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Compiler and Python shim
        run: |
          npm install --global @lmctl-ai/lmctl@0.2.420
          echo "LMSCRIPT_TOOL_CACHE=$RUNNER_TEMP/sample-tool-cache" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == Windows ]]; then
            mkdir -p .ci-bin
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > .ci-bin/python3
            chmod +x .ci-bin/python3
            echo "$PWD/.ci-bin" >> "$GITHUB_PATH"
          fi
      - name: Install the released binary and run the exact shared corpus
        run: |
          lmscript install "github:$GITHUB_REPOSITORY@$RELEASE_TAG"
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path('scripts/installed-path.lms')
          p.write_text(p.read_text().replace('@v0.1.0','@'+os.environ['RELEASE_TAG']),newline='\n')
          PY
          lmscript scripts/installed-path.lms > installed-path.txt
          installed="$(cat installed-path.txt | tr -d '\r')"
          python3 -B sample-suite/run-suite.py "$installed"
